<ion-header>
  <ion-toolbar>
    <ion-title>Recuperar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="max-width: 400px; margin: 40px auto 0;">
    <h2>Recupera tu acceso</h2>
    <p>Ingresa el correo registrado para solicitar un enlace de recuperación.</p>

    <form (ngSubmit)="enviar()" [attr.aria-busy]="loading">
      <ion-item>
        <ion-input
            label="Correo electrónico"
            labelPlacement="stacked"
            type="email"
            autocomplete="email"
            name="email"
            [(ngModel)]="email"
            [disabled]="loading"
            placeholder="Tu correo registrado">
        </ion-input>
      </ion-item>

      @if (errorMessage) {
        <ion-text color="danger">
          <p role="alert">{{ errorMessage }}</p>
        </ion-text>
      }
      @if (mensaje) {
        <ion-text color="success">
          <p role="status">{{ mensaje }}</p>
        </ion-text>
      }

      <ion-button
          type="submit"
          expand="block"
          class="ion-margin-top"
          [disabled]="loading">
        @if (loading) {
          <ion-spinner name="crescent" aria-label="Solicitando recuperación"></ion-spinner>
          <span style="margin-left: 8px;">Enviando...</span>
        } @else {
          <span>Enviar enlace</span>
        }
      </ion-button>
    </form>

    <ion-button
        type="button"
        fill="clear"
        expand="block"
        (click)="volver()"
        [disabled]="loading">
      Volver al inicio de sesión
    </ion-button>
  </div>
</ion-content>
