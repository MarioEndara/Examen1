<ion-header>
  <ion-toolbar>
    <ion-title>Cambiar contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="max-width: 400px; margin: 40px auto 0;">
    <h2>Establece tu contraseña personal</h2>
    <p>Para continuar, utiliza una contraseña de al menos 8 caracteres diferente de la contraseña inicial.</p>

    <form (ngSubmit)="guardar()" [attr.aria-busy]="loading">
      <ion-item>
        <ion-input
            label="Nueva contraseña"
            labelPlacement="stacked"
            type="password"
            autocomplete="new-password"
            name="nuevaPassword"
            [(ngModel)]="nuevaPassword"
            [disabled]="loading">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
            label="Repite la nueva contraseña"
            labelPlacement="stacked"
            type="password"
            autocomplete="new-password"
            name="confirmarPassword"
            [(ngModel)]="confirmarPassword"
            [disabled]="loading">
        </ion-input>
      </ion-item>

      @if (errorMessage) {
        <ion-text color="danger">
          <p role="alert">{{ errorMessage }}</p>
        </ion-text>
      }

      <ion-button
          type="submit"
          expand="block"
          class="ion-margin-top"
          [disabled]="loading">
        @if (loading) {
          <ion-spinner name="crescent" aria-label="Actualizando contraseña"></ion-spinner>
          <span style="margin-left: 8px;">Procesando...</span>
        } @else {
          <span>Guardar contraseña</span>
        }
      </ion-button>
    </form>

    <ion-button
        type="button"
        fill="clear"
        expand="block"
        (click)="salir()"
        [disabled]="loading">
      Salir
    </ion-button>
  </div>
</ion-content>
