<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div style="max-width: 400px; margin: 50px auto 0;">
    <h2 style="text-align: center; font-weight: bold;">Gestión Electoral</h2>
    <p style="text-align: center;">Ingresa tu cédula y contraseña para continuar</p>

    <form (ngSubmit)="onLogin()" [attr.aria-busy]="loading">
      <ion-item>
        <ion-input
          label="Cédula"
          labelPlacement="stacked"
          type="text"
          inputmode="numeric"
          [maxlength]="10"
          autocomplete="username"
          name="cedula"
          [(ngModel)]="cedula"
          [disabled]="loading"
          placeholder="10 dígitos">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="stacked"
          type="password"
          autocomplete="current-password"
          name="password"
          [(ngModel)]="password"
          [disabled]="loading"
          placeholder="Tu contraseña actual">
        </ion-input>
      </ion-item>

      @if (errorMessage) {
        <ion-text color="danger">
          <p role="alert">{{ errorMessage }}</p>
        </ion-text>
      }

      @if (successMessage) {
        <ion-text color="success">
          <p role="status">{{ successMessage }}</p>
        </ion-text>
      }

      <ion-button
          type="submit"
          expand="block"
          class="ion-margin-top"
          [disabled]="loading">
        @if (loading) {
          <ion-spinner name="crescent" aria-label="Iniciando sesión"></ion-spinner>
          <span style="margin-left: 8px;">Ingresando...</span>
        } @else {
          <span>Ingresar</span>
        }
      </ion-button>
    </form>

    <ion-button
        type="button"
        fill="clear"
        expand="block"
        [disabled]="loading"
        (click)="irARecuperar()">
      Recuperar contraseña
    </ion-button>
  </div>
</ion-content>
