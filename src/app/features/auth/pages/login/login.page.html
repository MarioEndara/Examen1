<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div style="max-width: 400px; margin: 0 auto; margin-top: 50px;">
    <h2 style="text-align: center; font-weight: bold;">Gestión Electoral</h2>
    <p style="text-align: center; color: gray;">Ingresa tus credenciales para continuar</p>

    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input type="email" [(ngModel)]="email" placeholder="correo@ejemplo.com"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input type="password" [(ngModel)]="password" placeholder="********"></ion-input>
    </ion-item>

    <ion-text color="danger" *ngIf="errorMessage">
      <p style="text-align: center; margin-top: 10px;">{{ errorMessage }}</p>
    </ion-text>

    <ion-button expand="block" class="ion-margin-top" (click)="onLogin()" [disabled]="loading">
      <ion-spinner *ngIf="loading"></ion-spinner>
      <span *ngIf="!loading">Ingresar</span>
    </ion-button>
  </div>
</ion-content>
